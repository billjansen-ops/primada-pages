  <title>Primada — One moment</title>
  <!-- One self-contained file (the logo is built in): it lives OUTSIDE the app, on a host that stays up,
       and Heroku shows it when the app is in maintenance mode or down (Session 186). Source of truth:
       bootstrap/maintenance/ in the Loyalty-Demo repo; published copy: the primada-pages repository. -->
  <style>
    :root { --red: #e31b1b; --ink: #1e293b; --muted: #64748b; --line: #e2e8f0; }
    html, body { height: 100%; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f7f7f7; color: var(--ink); display: flex; align-items: center; justify-content: center; }
    .card { background: white; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.06); padding: 40px 44px; max-width: 460px; width: calc(100% - 32px); text-align: center; }
    .logo img { height: 44px; }
    .bar { height: 4px; border-radius: 2px; background: #fde2e2; margin: 26px auto 28px; width: 72%; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 40%; background: var(--red); border-radius: 2px; animation: slide 1.6s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    h1 { font-size: 22px; margin: 0 0 10px; font-weight: 700; }
    p { margin: 0 0 10px; font-size: 15px; line-height: 1.5; color: var(--muted); }
    .small { font-size: 12.5px; color: #94a3b8; margin-top: 22px; }
    a { color: var(--red); text-decoration: none; font-weight: 600; }
  </style>
